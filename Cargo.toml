[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/core-db",
    "crates/core-providers",
    "crates/core-audio",
    "crates/core-server",
    "crates/core-ffi",
]

[workspace.package]
version = "0.2.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blowfish = "0.10"
bytes = "1"
cbc = "0.2"
chardetng = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cipher = "0.5"
encoding_rs = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
md-5 = "0.10"
notify = "8"
opus2 = { version = "0.4", features = ["bundled", "static"] }
quick-xml = { version = "0.37", features = ["serialize"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
windows = "0.62.2"
