          <rect x="112" y="0" width="8" height="72" rx="2"/><rect x="126" y="0" width="8" height="64" rx="2"/>
          <rect x="140" y="0" width="8" height="50" rx="2"/><rect x="154" y="0" width="8" height="38" rx="2"/>
          <rect x="168" y="0" width="8" height="58" rx="2"/><rect x="182" y="0" width="8" height="76" rx="2"/>
          <rect x="196" y="0" width="8" height="66" rx="2"/><rect x="210" y="0" width="8" height="48" rx="2"/>
          <rect x="224" y="0" width="8" height="36" rx="2"/><rect x="238" y="0" width="8" height="52" rx="2"/>
          <rect x="252" y="0" width="8" height="64" rx="2"/><rect x="266" y="0" width="8" height="46" rx="2"/>
          <rect x="280" y="0" width="8" height="34" rx="2"/><rect x="294" y="0" width="8" height="42" rx="2"/>
          <rect x="308" y="0" width="8" height="56" rx="2"/><rect x="322" y="0" width="8" height="49" rx="2"/>
          <rect x="336" y="0" width="8" height="38" rx="2"/><rect x="350" y="0" width="8" height="30" rx="2"/>
          <rect x="364" y="0" width="8" height="44" rx="2"/><rect x="378" y="0" width="8" height="52" rx="2"/>
