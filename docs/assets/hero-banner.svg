      <text x="209" y="16" text-anchor="middle" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">YT Music</text>

      <rect x="250" y="0" width="58" height="24" rx="6" fill="#0070F3" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.6"/>
      <text x="279" y="16" text-anchor="middle" fill="#7DD3FC" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">Qobuz</text>

      <rect x="316" y="0" width="54" height="24" rx="6" fill="#14B8A6" fill-opacity="0.2" stroke="#2DD4BF" stroke-opacity="0.6"/>
      <text x="343" y="16" text-anchor="middle" fill="#5EEAD4" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">TIDAL</text>

      <rect x="378" y="0" width="56" height="24" rx="6" fill="#A855F7" fill-opacity="0.2" stroke="#C084FC" stroke-opacity="0.6"/>
