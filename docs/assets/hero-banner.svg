        <rect x="318" y="6" width="30" height="15" rx="4" fill="#0B0F19" fill-opacity="0.75"/>
        <text x="333" y="16.5" text-anchor="middle" fill="#F87171" font-family="Segoe UI, Inter, sans-serif" font-size="8.5" font-weight="700">YTM</text>
        <text x="244" y="126" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">In Rainbows</text>
        <text x="244" y="141" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="10">Radiohead • Lossless</text>

