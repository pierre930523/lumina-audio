  <rect width="1200" height="540" rx="20" fill="url(#glowBlue)"/>
  <rect width="1200" height="540" rx="20" fill="url(#glowPurple)"/>
  <rect x="1" y="1" width="1198" height="538" rx="19" fill="none" stroke="#334155" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Left Hero Brand Section -->
  <g transform="translate(52, 54)">
