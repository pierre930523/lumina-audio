    <rect x="0" y="0" width="295" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45"/>
    <circle cx="16" cy="15" r="4.5" fill="#22C55E"/>
    <text x="30" y="19.5" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">v0.2.2 • Bit-Perfect Rust Core + Flutter Desktop</text>

    <!-- Title -->
    <text x="0" y="84" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.8">Lumina Audio</text>
    <text x="0" y="120" fill="url(#accentGrad)" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700">Audiophile Lossless Music Player for Windows</text>
    <text x="0" y="152" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="14">原生 WASAPI Exclusive / Win64 ASIO 直通 • 64-bit 浮點錄音室 DSP</text>
    <text x="0" y="174" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="14">五大串流平台 WebView2 自動登入 (DPAPI 加密) 與智慧首頁推薦</text>

    <!-- Tech Spec Grid Cards -->
    <g transform="translate(0, 202)">
      <rect x="0" y="0" width="210" height="72" rx="12" fill="#111827" fill-opacity="0.85" stroke="#1E293B"/>
      <text x="16" y="26" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">BIT-PERFECT OUTPUT</text>
      <text x="16" y="48" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">32-bit / 768kHz • DSD512</text>
      <text x="16" y="63" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">WASAPI Exclusive / Native ASIO</text>

      <rect x="224" y="0" width="210" height="72" rx="12" fill="#111827" fill-opacity="0.85" stroke="#1E293B"/>
      <text x="240" y="26" fill="#A855F7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">STUDIO 64-BIT DSP</text>
      <text x="240" y="48" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">10-Band PEQ + AutoEQ</text>
      <text x="240" y="63" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">Bauer Crossfeed • ReplayGain 2.0</text>

      <rect x="0" y="84" width="210" height="72" rx="12" fill="#111827" fill-opacity="0.85" stroke="#1E293B"/>
      <text x="16" y="110" fill="#10B981" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">ZERO-JANK 60FPS+ UI</text>
      <text x="16" y="132" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">64-Band FFT • Synced LRC</text>
      <text x="16" y="147" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">3-Layer GPU Stack • 5-Level Esc</text>

      <rect x="224" y="84" width="210" height="72" rx="12" fill="#111827" fill-opacity="0.85" stroke="#1E293B"/>
      <text x="240" y="110" fill="#F59E0B" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">5 STREAMING SERVICES</text>
      <text x="240" y="132" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">WebView2 + Win32 DPAPI</text>
      <text x="240" y="147" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">&lt;16ms Optimistic Switch • Preload</text>
