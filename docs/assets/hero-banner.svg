        <rect x="434" y="6" width="36" height="15" rx="4" fill="#0B0F19" fill-opacity="0.75"/>
        <text x="452" y="16.5" text-anchor="middle" fill="#C084FC" font-family="Segoe UI, Inter, sans-serif" font-size="8.5" font-weight="700">DEEZER</text>
