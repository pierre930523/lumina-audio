<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#stBg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="42" y="44" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">五大串流平台 WebView2 自動登入、DPAPI 硬體級加密與首頁個人化推薦</text>
  <text x="42" y="68" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="13">內嵌原生 Win32 WebView2 自動攔截憑證 → 真實 API 驗證 → Windows DPAPI (CryptProtectData) 加密保存 → 秒開主頁推薦</text>

  <!-- Left Card: WebView2 Auto-Capture + DPAPI Security Flow -->
  <g transform="translate(42, 94)">
    <rect x="0" y="0" width="540" height="252" rx="14" fill="#0F172A" stroke="#334155"/>
    <text x="22" y="34" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="800">1. 原生 WebView2 自動擷取憑證 &amp; Windows DPAPI 加密</text>

    <rect x="22" y="52" width="496" height="48" rx="8" fill="#1E293B"/>
    <text x="38" y="73" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">開啟官方登入視窗 (WebView2 / Loopback OAuth 2.0 PKCE)</text>
    <text x="38" y="90" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11">自動擷取 HttpOnly Cookie (SAPISID / arl) 與標頭 (X-User-Auth-Token / Media-User-Token)</text>

    <rect x="22" y="112" width="496" height="48" rx="8" fill="#1E293B"/>
    <text x="38" y="133" fill="#34D399" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">即時驗證官方帳號 API (杜絕假登入與無效 Token)</text>
    <text x="38" y="150" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11">即時查詢會員名稱、訂閱等級 (Hi-Res / Max / HiFi / Premium) 與無損串流權限</text>

    <rect x="22" y="172" width="496" height="58" rx="8" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="38" y="195" fill="#A7F3D0" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">🔒 Win32 CryptProtectData (DPAPI) 本機加密保存</text>
    <text x="38" y="214" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="11">綁定當前 Windows 使用者金鑰加密落盤，磁碟永不留存明文 Token；角落保留進階手動輸入備援</text>
  </g>

  <!-- Right Card: Personalized Recommendations & Non-Blocking Playback -->
  <g transform="translate(618, 94)">
    <rect x="0" y="0" width="540" height="252" rx="14" fill="#0F172A" stroke="#334155"/>
    <text x="22" y="34" fill="#C084FC" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="800">2. 主頁個人化推薦專輯／歌曲 &amp; 16ms 樂觀無縫點播</text>

    <!-- Filter Capsules -->
    <rect x="22" y="50" width="54" height="24" rx="12" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8"/>
    <text x="49" y="66" text-anchor="middle" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">全部</text>
    <rect x="84" y="50" width="68" height="24" rx="12" fill="#1E293B"/>
    <text x="118" y="66" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="11">Qobuz</text>
    <rect x="160" y="50" width="64" height="24" rx="12" fill="#1E293B"/>
    <text x="192" y="66" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="11">TIDAL</text>
    <rect x="232" y="50" width="82" height="24" rx="12" fill="#1E293B"/>
    <text x="273" y="66" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="11">YT Music</text>
    <rect x="322" y="50" width="68" height="24" rx="12" fill="#1E293B"/>
    <text x="356" y="66" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="11">Deezer</text>

    <!-- Track Rows -->
    <rect x="22" y="88" width="496" height="44" rx="8" fill="#1E293B"/>
    <circle cx="44" cy="110" r="12" fill="#38BDF8" fill-opacity="0.25"/>
    <text x="44" y="114" text-anchor="middle" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">▶</text>
    <text x="68" y="106" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Giorgio by Moroder</text>
    <text x="68" y="123" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11">Daft Punk • Random Access Memories</text>
    <rect x="412" y="98" width="92" height="22" rx="6" fill="#0B0F19"/>
    <text x="458" y="113" text-anchor="middle" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700">QOBUZ 24/88.2</text>

    <rect x="22" y="140" width="496" height="44" rx="8" fill="#1E293B"/>
    <circle cx="44" cy="162" r="12" fill="#2DD4BF" fill-opacity="0.25"/>
    <text x="44" y="166" text-anchor="middle" fill="#2DD4BF" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">▶</text>
    <text x="68" y="158" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700">Everything In Its Right Place</text>
    <text x="68" y="175" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11">Radiohead • Kid A</text>
    <rect x="412" y="150" width="92" height="22" rx="6" fill="#0B0F19"/>
    <text x="458" y="165" text-anchor="middle" fill="#2DD4BF" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700">TIDAL FLAC</text>

    <text x="22" y="214" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">• 點擊推薦專輯 → 進入專輯詳情頁載入完整曲目（支援 Esc 5 層後退與 &lt; 返回）</text>
    <text x="22" y="234" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">• 點擊推薦歌曲 → Generation ID + CancelToken 非阻塞播放，切歌零凍結</text>
  </g>
</svg>
