<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pipeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#spBg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="42" y="44" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">Bit-Perfect 音訊直出與 64-bit 浮點 DSP 訊號鏈 (Signal Path Architecture)</text>
  <text x="42" y="68" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="13">從音源解碼到硬體 DAC 全程透明可驗證，支援一鍵 Bypass 直通硬體</text>

  <!-- Connecting Pipeline Line -->
  <line x1="160" y1="184" x2="1040" y2="184" stroke="url(#pipeLine)" stroke-width="4" stroke-dasharray="8 5"/>

  <!-- Node 1: Source -->
  <g transform="translate(42, 102)">
    <rect x="0" y="0" width="210" height="164" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="18" y="30" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">STAGE 1 • SOURCE</text>
    <text x="18" y="54" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">無損曲庫與五大串流</text>
    <text x="18" y="80" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 本機 FLAC / ALAC / WAV / AIFF</text>
    <text x="18" y="100" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Native DSD (.dsf / .dff)</text>
    <text x="18" y="120" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Qobuz / Tidal / YTM / Deezer</text>
    <text x="18" y="140" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• WebDAV / SMB 遠端掛載</text>
  </g>

  <!-- Node 2: Decoder -->
  <g transform="translate(284, 102)">
    <rect x="0" y="0" width="210" height="164" rx="14" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="18" y="30" fill="#818CF8" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">STAGE 2 • DECODER</text>
    <text x="18" y="54" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">非阻塞串流與解碼器</text>
    <text x="18" y="80" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Symphonia 純 Rust 解碼</text>
    <text x="18" y="100" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• DSD64~DSD512 / DoP v1.1</text>
    <text x="18" y="120" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• HTTP Range 分塊非阻塞緩衝</text>
    <text x="18" y="140" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 15 秒前靜默背景預解析</text>
  </g>

  <!-- Node 3: 64-bit DSP -->
  <g transform="translate(526, 102)">
    <rect x="0" y="0" width="210" height="164" rx="14" fill="#0F172A" stroke="#A855F7" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="18" y="30" fill="#C084FC" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">STAGE 3 • 64-BIT FLOAT DSP</text>
    <text x="18" y="54" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">錄音室級數位處理</text>
    <text x="18" y="80" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 10-Band ISO 參量等化器</text>
    <text x="18" y="100" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• AutoEQ 耳機補償設定匯入</text>
    <text x="18" y="120" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Bauer 雙耳聲學 Crossfeed</text>
    <text x="18" y="140" fill="#34D399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">• 支援 Strict Bit-Perfect Bypass</text>
  </g>

  <!-- Node 4: Lock-Free RingBuffer & Hardware Output -->
  <g transform="translate(768, 102)">
    <rect x="0" y="0" width="390" height="164" rx="14" fill="#0F172A" stroke="#10B981" stroke-opacity="0.75" stroke-width="1.5"/>
    <text x="18" y="30" fill="#34D399" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">STAGE 4 • HARDWARE DIRECT OUTPUT</text>
    <text x="18" y="54" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">無鎖環形緩衝 &amp; 原生硬體驅動直出</text>
    <text x="18" y="80" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Epoch-based Lock-Free RingBuffer（Seek/切歌零爆音）</text>
    <text x="18" y="100" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• WASAPI Exclusive 獨佔模式（完全繞過 Windows 混音器）</text>
    <text x="18" y="120" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Win64 Clean-Room COM ASIO 原生低延遲硬體直通</text>
    <text x="18" y="140" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• DLNA / AirPlay 多房間音區時鐘同步 (Clock Sync)</text>
  </g>
</svg>
